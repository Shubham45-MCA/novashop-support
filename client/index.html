<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaShop - Customer Support Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <div class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></div>
            <h1 class="text-xl font-bold tracking-wide">NovaShop Support Assistant</h1>
        </div>
        <span class="text-xs bg-emerald-600/30 text-emerald-400 px-3 py-1 rounded-full border border-emerald-500/30">AI + Human Desk</span>
    </header>

    <!-- Quick E-Commerce Actions -->
    <div class="bg-slate-800/60 border-b border-slate-700/50 py-2 px-4 flex space-x-3 overflow-x-auto text-xs">
        <button onclick="sendQuickQuery('Check status of ORD-101')" class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg whitespace-nowrap transition">📦 Track ORD-101</button>
        <button onclick="sendQuickQuery('Check status of ORD-102')" class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg whitespace-nowrap transition">📦 Track ORD-102</button>
        <button onclick="sendQuickQuery('What is your return policy?')" class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg whitespace-nowrap transition">🔄 Return Policy</button>
        <button onclick="sendQuickQuery('I want to speak with a human agent')" class="bg-indigo-600 hover:bg-indigo-500 px-3 py-1.5 rounded-lg whitespace-nowrap transition text-white">👨‍💼 Talk to Agent</button>
    </div>

    <!-- Main Chat Area -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col overflow-hidden">
        <div id="chat-container" class="flex-1 overflow-y-auto space-y-4 pr-2 mb-4 scrollbar-thin">
            <div class="flex items-start space-x-3">
                <div class="bg-emerald-600 text-white rounded-full w-8 h-8 flex items-center justify-center font-bold text-sm">AI</div>
                <div class="bg-slate-800 border border-slate-700 p-3.5 rounded-2xl max-w-md text-sm leading-relaxed shadow-sm">
                    Hello! Welcome to NovaShop Support. I can help you track orders (ORD-101, ORD-102, ORD-103), check return policies, or escalate issues to our human support team. How can I help you today?
                </div>
            </div>
        </div>

        <!-- Ticket Escalation Box -->
        <div id="ticket-box" class="bg-slate-800 border border-slate-700 p-3 rounded-xl mb-3 hidden">
            <h3 class="text-xs font-semibold text-emerald-400 uppercase tracking-wider mb-2">Escalate Chat to Human Agent</h3>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                <input type="text" id="ticket-name" placeholder="Your Name" class="bg-slate-900 border border-slate-700 text-xs rounded px-3 py-2 focus:outline-none focus:border-emerald-500">
                <input type="email" id="ticket-email" placeholder="Your Email" class="bg-slate-900 border border-slate-700 text-xs rounded px-3 py-2 focus:outline-none focus:border-emerald-500">
                <button onclick="submitTicket()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-medium py-2 rounded transition">Submit Ticket with Chat History</button>
            </div>
        </div>

        <!-- Input Bar -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-2 flex items-center shadow-lg">
            <input type="text" id="user-input" placeholder="Type your query here..." class="flex-1 bg-transparent border-none focus:outline-none px-3 text-sm text-slate-100 placeholder-slate-400">
            <button onclick="toggleTicketBox()" class="text-slate-400 hover:text-emerald-400 px-3 text-xs border-r border-slate-700 mr-2 transition">Raise Ticket</button>
            <button onclick="sendMessage()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow">Send</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
